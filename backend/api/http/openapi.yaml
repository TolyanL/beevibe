openapi: 3.1.0
info:
  title: BeeVibe API
  version: 0.1.0
  description: >
    API генератора браузерных игр. Авторизация — сессионная cookie `session`
    (HttpOnly, SameSite=Lax). Ошибки — единый формат `{ "error": { "code", "message" } }`.
servers:
  - url: /api

tags:
  - name: auth
  - name: profile
  - name: games
  - name: catalog
  - name: public

paths:
  /health:
    get:
      tags: [catalog]
      summary: Проверка живости сервиса
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан, установлена сессионная cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      summary: Вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Неверные креды
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [profile]
      summary: Текущий пользователь
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile:
    patch:
      tags: [profile]
      summary: Обновить публичное имя автора
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 40
      responses:
        "200":
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [profile]
      summary: "Профиль: баланс, мои игры, история операций, цены"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/topup:
    post:
      tags: [profile]
      summary: Демо-пополнение баланса (без реальной оплаты)
      description: >
        Сумма ограничена `tokens.topup_min`/`tokens.topup_max`, суточный лимит —
        `tokens.topup_daily_cap`. Выключается флагом `tokens.demo_topup`.
        Заголовок `Idempotency-Key` защищает от двойного начисления при ретрае.
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "200":
          description: Новый баланс
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Демо-пополнение выключено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Суточный лимит пополнений исчерпан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games:
    get:
      tags: [games]
      summary: Список игр текущего пользователя с пагинацией
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, analyzing, planning, coding, assets, reviewing, assembling, checking, patching, ready, failed]
        - name: sort
          in: query
          description: Порядок выдачи
          schema:
            type: string
            enum: [created_at, tokens_cost]
            default: created_at
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Игры и общий счёт по фильтрам без учёта limit/offset
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfileGame"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [games]
      summary: Запустить генерацию игры
      description: >
        Списывает TOKENS_PRICE_GENERATE токенов и ставит игру в очередь конвейера.
        Заголовок `Idempotency-Key` (опционально): повторный запрос с тем же ключом
        возвращает ту же игру и не списывает токены второй раз.
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Игра поставлена в очередь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Не хватает токенов или запрос уже выполняется
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}:
    parameters:
      - $ref: "#/components/parameters/GameId"
    delete:
      tags: [games]
      summary: Мягко удалить игру (deleted_at; пропадает из каталога и профиля)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Игра помечена удалённой
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Игра сейчас правится
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [games]
      summary: "Полный профиль игры: статус, этапы, spec, конфиг, версии, цена"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Профиль игры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{id}/visibility:
    parameters:
      - $ref: "#/components/parameters/GameId"
    patch:
      tags: [games]
      summary: Опубликовать игру в каталоге или скрыть её
      description: Публиковать можно только готовую игру; каталог показывает лишь `public`-игры.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility:
                  type: string
                  enum: [public, private]
      responses:
        "200":
          description: Новое значение видимости
          content:
            application/json:
              schema:
                type: object
                properties:
                  visibility:
                    type: string
                    enum: [public, private]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Игра не готова или уже правится
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/meta:
    parameters:
      - $ref: "#/components/parameters/GameId"
    patch:
      tags: [games]
      summary: Название, описание и обложка игры (без LLM, бесплатно)
      description: Частичное обновление — незаданные поля остаются как были.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameMetaRequest"
      responses:
        "200":
          description: Сохранённая мета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{id}/meta/generate:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Сгенерировать название, описание и обложку за токены
      description: >
        Списывает `tokens.price_meta` и ставит задачу в воркер: клиент получает `202`,
        а результат приходит в SSE-поток событием `artifact{kind:"meta"}`.
        При ошибке до первого ответа модели токены возвращаются.
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        "202":
          description: Генерация поставлена в очередь
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued]
                  resume_from:
                    type: string
                    description: Этап, с которого продолжится конвейер
                    enum: [analyzing, planning, coding, assets, reviewing, assembling, checking]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Не хватает токенов или игра сейчас правится
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      tags: [games]
      summary: SSE-поток событий генерации
      description: >
        События: `stage` (этап конвейера, статусы `running`/`done`/`error`),
        `artifact` (spec, config, version), `done` (финальная версия и цена),
        `error` (код и текст ошибки). Событие приходит как `event: <type>` с JSON
        в `data` и порядковым номером в `id`. Поддерживается реконнект:
        клиент шлёт `Last-Event-ID`, сервер доигрывает пропущенные события.
        Патч и починка идут тем же потоком: этапы `patching` и `checking`.
      security:
        - sessionCookie: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: event-stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /games/{id}/patch:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Поставить правку игры текстом в очередь (LLM работает в воркере)
      description: >
        Запрос принимает правку, списывает токены и возвращает `202` со статусом `patching`.
        Новая версия собирается асинхронно: прогресс и результат приходят в SSE-поток
        `/games/{id}/stream` событиями `stage`, `artifact`, `done`, `error`.
        Заголовок `Idempotency-Key` защищает от повторного списания при ретрае.
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 4000
      responses:
        "202":
          description: Правка принята, версия появится в SSE-потоке
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Нет токенов, игра уже правится или запрос уже выполняется
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/review/accept:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Принять код с замечаниями ревью и собрать версию
      description: >
        Доступно, когда конвейер остановился в статусе `needs_decision`. Игра возвращается
        в очередь и продолжает с этапа сборки: код не перегенерируется.
      security:
        - sessionCookie: []
      responses:
        "202":
          description: Игра снова в очереди, начиная с этапа сборки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Игра не ждёт решения по ревью
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/review/regenerate:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Перегенерировать только код после замечаний ревью
      description: >
        Доступно в статусе `needs_decision`. Спека, план и ассеты сохраняются, конвейер
        продолжает с этапа кода — полный проход не нужен.
      security:
        - sessionCookie: []
      responses:
        "202":
          description: Игра снова в очереди, начиная с этапа кода
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Игра не ждёт решения по ревью
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Перезапустить упавшую генерацию без нового списания
      description: >
        Доступно только для игры в статусе `failed`; игра возвращается в очередь с теми же
        `prompt` и `params`. Артефакты пройденных этапов сохранены, поэтому конвейер
        продолжает с упавшего этапа — `resume_from` говорит, с какого именно.
        Клиент получает `202 {status:"queued"}` и обычный SSE-поток.
      security:
        - sessionCookie: []
      responses:
        "202":
          description: Игра снова в очереди конвейера
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued]
                  resume_from:
                    type: string
                    description: Этап, с которого продолжится конвейер
                    enum: [analyzing, planning, coding, assets, reviewing, assembling, checking]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Игра не в статусе failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Отменить идущую генерацию или правку
      description: >
        Отменяет задачу воркера и дожидается её остановки. Токены возвращаются, только если
        модель ещё не ответила ни на один запрос; после первого ответа списание сохраняется.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Итоговый статус игры после отмены
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Отменять нечего — задача не запущена или уже завершена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/config:
    parameters:
      - $ref: "#/components/parameters/GameId"
    patch:
      tags: [games]
      summary: Параметрическая правка CONFIG (без LLM, бесплатно)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigRequest"
      responses:
        "200":
          description: Новая версия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /games/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Откат к версии
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Новая версия с содержимым отката
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{id}/fix:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Поставить починку игры в очередь (repair-агент работает в воркере)
      description: >
        Запрос принимает починку и возвращает `202` со статусом `patching`.
        Прогресс и результат приходят в SSE-поток `/games/{id}/stream`.
        Заголовок `Idempotency-Key` защищает от повторной постановки задачи.
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  description: Текст ошибки из оверлея превью
      responses:
        "202":
          description: Починка принята, версия появится в SSE-потоке
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameJobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Игра правится/генерируется или исчерпан лимит починок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/rate:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Оценка игры по пятибалльной шкале (одна на пользователя, изменяемая)
      description: Автор игры не может оценивать собственную игру — такой запрос отклоняется с `403 cannot_rate_own_game`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Оценка и агрегат
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: integer
                    minimum: 1
                    maximum: 5
                  aggregate:
                    $ref: "#/components/schemas/RatingAggregate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Запрос от автора игры — оценивать свою игру нельзя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/{id}/playtime:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      tags: [games]
      summary: Зафиксировать наигранное время
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds:
                  type: integer
                  minimum: 0
                  maximum: 300
      responses:
        "200":
          description: Суммарное время игры
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalSeconds:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/token-ops:
    get:
      tags: [profile]
      summary: История операций с токенами (пагинация)
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Операции и общий счёт без учёта limit/offset
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfileTokenOp"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /catalog:
    get:
      tags: [catalog]
      summary: Каталог игр со статистикой
      parameters:
        - name: q
          in: query
          description: Полнотекстовый поиск по промпту игры (подстрока)
          schema:
            type: string
            maxLength: 200
        - name: q
          in: query
          description: Поиск по промпту игры (подстрока)
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          schema:
            type: string
            enum: [rating, hours, fresh]
            default: fresh
        - name: genre
          in: query
          schema:
            type: string
            enum: [arcade, snake, clicker, platformer, puzzle, custom]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Карточки каталога
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogCard"
                  total:
                    description: Общее число карточек по фильтрам без учёта limit/offset
                    type: integer

  /games/{id}/public:
    get:
      tags: [public]
      summary: Публичная карточка игры (метаданные и агрегаты, без HTML)
      security:
        - sessionCookie: []
        - {}
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Карточка игры; для авторизованного зрителя заполняется my_rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePublicCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /g/{id}:
    servers:
      - url: /
    get:
      tags: [public]
      summary: Игра как готовый self-contained HTML (без логина)
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: HTML игры
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /g/{id}/download:
    servers:
      - url: /
    get:
      tags: [public]
      summary: Скачать игру файлом game.html
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Вложение game.html
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: "Slug игры. Идентификатор из базы в адресах не используется."
      schema:
        type: string
        example: neonovaya-zmeyka-1a2b

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Требуется вход
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Не владелец игры
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: not_enough_tokens
            message:
              type: string

    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        balance:
          type: integer
          format: int64

    UserEnvelope:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ProfileGame:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prompt:
          type: string
        title:
          type: string
        slug:
          type: string
        genre:
          type: string
        status:
          type: string
        visibility:
          type: string
          enum: [public, private]
        tokens_cost:
          type: integer
        model_calls:
          type: integer
        fixes:
          type: integer
        created_at:
          type: string
          format: date-time

    ProfileTokenOp:
      type: object
      properties:
        game_id:
          type: string
          format: uuid
          nullable: true
        delta:
          type: integer
          format: int64
        reason:
          type: string
          enum: [signup_grant, generate, patch, meta, topup, refund]
        created_at:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        balance:
          type: integer
          format: int64
        games:
          type: array
          items:
            $ref: "#/components/schemas/ProfileGame"
        token_ops:
          type: array
          items:
            $ref: "#/components/schemas/ProfileTokenOp"
        prices:
          type: object
          properties:
            generate:
              type: integer
              format: int64
            patch:
              type: integer
              format: int64

    CreateGameRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 2000
        title:
          type: string
          maxLength: 80
          description: Необязательное название игры
        description:
          type: string
          maxLength: 500
          description: Необязательное описание игры для карточки в каталоге
        genre:
          type: string
          enum: [arcade, snake, clicker, platformer, puzzle, custom]
        tempo:
          type: integer
          minimum: 1
          maximum: 10
        mapSize:
          type: string
          enum: [small, medium, large]
        style:
          type: string
          enum: [pixel, cartoon, neon, minimal, custom]
        customGenre:
          type: string
          maxLength: 32
          description: Своя механика, обязательна при genre=custom
        customStyle:
          type: string
          maxLength: 160
          description: Свободный текст стиля (например «аниме-нуар, бумажный коллаж»), обязателен при style=custom

    CreateGameResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: "Читаемая ссылка на игру: /games/{slug} и /play/{slug}"
        status:
          type: string
          example: queued

    GameSpec:
      type: object
      properties:
        genre:
          type: string
        mechanic:
          type: string
        controls:
          type: string
        win_condition:
          type: string
        lose_condition:
          type: string
        palette:
          type: array
          items:
            type: string
        map_size:
          type: string
        style:
          type: string
        audience:
          type: string
        assets:
          type: array
          items:
            type: string

    GameConfig:
      type: object
      properties:
        tempo:
          type: integer
        palette:
          type: array
          items:
            type: string
        map_size:
          type: string
        difficulty:
          type: string
        controls:
          type: string
        style:
          type: string

    Stage:
      type: object
      properties:
        stage:
          type: string
          example: coding
        status:
          type: string
          enum: [running, done]
        durationMs:
          type: integer
          format: int64
        issues:
          type: integer
        operation:
          type: string
          description: Тип операции для этапа patching (patch/fix)

    Version:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        source:
          type: string
          enum: [generate, review, patch, config, repair, rollback]
        note:
          type: string
        tokens_cost:
          type: integer
        model_calls:
          type: integer
        prompt_version:
          type: string
        created_at:
          type: string
          format: date-time

    VersionResponse:
      type: object
      properties:
        versionId:
          type: string
          format: uuid

    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prompt:
          type: string
        title:
          type: string
          description: Название игры; пустое, пока автор его не задал
        description:
          type: string
        slug:
          type: string
          description: Читаемый идентификатор для публичных ссылок
        cover:
          $ref: "#/components/schemas/GameCover"
        params:
          type: object
          properties:
            genre:
              type: string
            custom_genre:
              type: string
            tempo:
              type: integer
            map_size:
              type: string
            style:
              type: string
            custom_style:
              type: string
        status:
          type: string
          enum: [queued, analyzing, planning, coding, assets, reviewing, assembling, checking, patching, needs_decision, ready, failed]
        fail_reason:
          type: string
          description: Причина остановки конвейера, заполнен только в статусе failed
        visibility:
          type: string
          enum: [public, private]
          description: Видимость игры в каталоге; новые игры создаются private
        created_at:
          type: string
          format: date-time
        review_issues:
          type: array
          description: Замечания ревью, пока игра ждёт решения автора
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              line:
                type: integer
        stages:
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        spec:
          $ref: "#/components/schemas/GameSpec"
        config:
          $ref: "#/components/schemas/GameConfig"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        cost:
          type: object
          properties:
            tokens:
              type: integer
            calls:
              type: integer
            fixes:
              type: integer
        rating:
          $ref: "#/components/schemas/RatingAggregate"
        my_rating:
          type: integer
          minimum: 0
          maximum: 5
        cursor:
          type: integer
          format: int64
          description: Последний порядковый номер события генерации на момент ответа
        operation:
          nullable: true
          description: Активная операция (патч/починка); null, когда игра не меняется
          type: object
          properties:
            kind:
              type: string
              enum: [patch, fix, config, meta]
            started_at:
              type: string
              format: date-time

    RatingAggregate:
      type: object
      properties:
        average:
          type: number
          description: Средняя оценка от 1 до 5
        total:
          type: integer
        counts:
          type: array
          description: Количество оценок 1, 2, 3, 4 и 5
          minItems: 5
          maxItems: 5
          items:
            type: integer

    PlaytimeAggregate:
      type: object
      properties:
        sessions:
          type: integer
        seconds:
          type: integer
        hours:
          type: number

    CatalogCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prompt:
          type: string
        genre:
          type: string
        map_size:
          type: string
        style:
          type: string
        title:
          type: string
        description:
          type: string
        cover:
          $ref: "#/components/schemas/GameCover"
        author:
          type: string
          description: Публичное имя автора
        slug:
          type: string
        custom_genre:
          type: string
        custom_style:
          type: string
        created_at:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/RatingAggregate"
        playtime:
          $ref: "#/components/schemas/PlaytimeAggregate"
        tokens_cost:
          type: integer
        model_calls:
          type: integer

    GameCover:
      type: object
      properties:
        palette:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
            example: "#ffcc00"
        style:
          type: string
        seed:
          type: string

    GameMeta:
      type: object
      properties:
        title:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        cover:
          $ref: "#/components/schemas/GameCover"

    GameMetaRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        cover:
          $ref: "#/components/schemas/GameCover"

    ReviewDecision:
      type: object
      properties:
        status:
          type: string
          example: queued
        resume_from:
          type: string
          enum: [analyzing, planning, coding, assets, reviewing, assembling, checking]

    GameJobAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [patching]

    GamePublicCard:
      type: object
      properties:
        custom_genre:
          type: string
        custom_style:
          type: string
        id:
          type: string
          format: uuid
        prompt:
          type: string
        title:
          type: string
        description:
          type: string
        slug:
          type: string
        author:
          type: string
        cover:
          $ref: "#/components/schemas/GameCover"
        genre:
          type: string
        style:
          type: string
        map_size:
          type: string
        created_at:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/RatingAggregate"
        playtime:
          $ref: "#/components/schemas/PlaytimeAggregate"
        my_rating:
          type: integer
          minimum: 0
          maximum: 5
          description: Оценка текущего зрителя, 0 если гость
        is_owner:
          type: boolean
          description: true, если смотрит автор игры (автор не может оценивать свою игру)

    UpdateConfigRequest:
      type: object
      properties:
        tempo:
          type: integer
          minimum: 1
          maximum: 10
        palette:
          type: array
          maxItems: 8
          items:
            type: string
        mapSize:
          type: string
          enum: [small, medium, large]
        difficulty:
          type: string
          maxLength: 32
