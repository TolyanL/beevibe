app:
  name: beevibe
  version: 1.4.0

http:
  port: "8080"
  read_timeout: 30s
  # 0s disables the write timeout: the SSE stream stays open for the whole generation
  write_timeout: 0s
  idle_timeout: 120s
  shutdown_timeout: 10s
  # Built SPA (frontend/dist): a missing or empty directory disables SPA serving
  static_dir: static

logger:
  level: info
  format: json

postgres:
  dsn: postgres://bee:12345@db:5432/bee?sslmode=disable
  max_conns: 10
  min_conns: 2
  connect_timeout: 5s

llm:
  api_key: ""
  model: deepseek/deepseek-v4.1-flash-1017
  base_url: https://openrouter.ai/api/v1
  # A reasoning model thinks for 2-3 minutes before the first content token (the coder: ~163s
  # measured), so the per-attempt timeout has to outlive that.
  timeout: 600s
  # Output cap over thinking plus text; 0 does not send the field. A small cap is a trap: the
  # coder spends ~20k tokens thinking, so a tighter limit returns empty content, finish=length.
  max_tokens: 0
  # A retry restarts the thinking from scratch, and a timeout is never retried at all.
  max_retries: 1
  retry_backoff: 2s
  # Dialect of the effort field: openrouter sends "reasoning": {"effort": ...},
  # openai sends "reasoning_effort": ... (OpenAI Chat Completions and llama.cpp,
  # none turns the thinking off).
  reasoning_dialect: openrouter
  # Empty disables the dump; otherwise a directory for the req/resp/meta of every attempt.
  debug_dir: ""

# Fast mode: spec+plan in one answer, then the whole game as one self-contained HTML document.
# No review stage, no assembler call, one repair attempt at most.
fast:
  # An empty model means the main llm client: only the number of calls shrinks.
  # Every other empty field is inherited from the llm block above.
  llm:
    model: xiaomi/mimo-v2.6-flash
    # Per request; above the pipeline budget so the pipeline deadline is the one that trips.
    # Without its own model the fast mode reuses the llm client and its timeout.
    timeout: 1500s
  # 0 falls back to worker.timeout. The streamed one-shot call writes the whole game,
  # so a slow model needs room: 600s ran out inside the coding stage.
  timeout: 1200s
  max_calls_per_game: 4
  # Validation passes: 2 means one repair call between them
  max_fix_attempts: 2

# Reasoning effort per request: default | none | minimal | low | medium | high | xhigh | max
# default does not send the field, the provider default applies.
# On commandcode any explicit effort backfires: the model thinks until max_tokens and returns
# empty content, so those stages must stay on default.
llm_reasoning:
  analyzer: default
  planner: default
  coder: default
  assets: default
  reviewer: default
  assembler: default
  patch: default
  repair: default

tokens:
  grant_signup: 1000000
  price_generate: 320000
  price_patch: 40000
  price_meta: 10000
  # Демо-пополнение: сумма за раз и суточный лимит на пользователя.
  topup_min: 10000
  topup_max: 1000000
  topup_daily_cap: 5000000
  demo_topup: true

worker:
  concurrency: 2
  # Six thinking calls back to back, ~14 minutes measured: 300s ran out inside the plan stage.
  timeout: 1800s
  max_calls_per_game: 12
  max_fix_attempts: 2

kafka:
  brokers:
    - kafka:9092
  topic: game.events
  group_id: beevibe
  write_timeout: 10s
  read_timeout: 10s

auth:
  bcrypt_cost: 10

validator:
  # Empty looks up node in PATH; without node the JS syntax check is skipped
  node_path: ""
