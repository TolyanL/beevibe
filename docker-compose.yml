name: beevibe

x-app: &app
  image: beevibe:latest
  build: .
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: ${POSTGRES_DB:-bee}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bee} -d ${POSTGRES_DB:-bee}",
        ]
      interval: 5s
      retries: 12
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9099"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9099"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka_init:
    image: confluentinc/cp-kafka:latest
    command: >
      kafka-topics --create --bootstrap-server kafka:9092
      --topic game.events --partitions 8 --if-not-exists
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  migrate:
    <<: *app
    entrypoint: ["goose", "-dir", "/app/migrations", "postgres"]
    command:
      [
        "${POSTGRES_DSN:-postgres://bee:12345@db:5432/bee?sslmode=disable}",
        "up",
      ]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_CONFIG_PATH: /app/configs/config.yaml
    volumes:
      - ./deploy/config.yaml:/app/configs/config.yaml:ro
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      kafka_init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
